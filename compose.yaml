x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      LANGFLOW_DB_PASSWORD: ${LANGFLOW_DB_PASSWORD:?Set LANGFLOW_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/10-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    networks:
      - database
    cpus: 1.0
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  langflow:
    <<: *service-defaults
    image: langflowai/langflow:1.13.4@sha256:f5a4fbf51ad51dfcc1f93b238ef58de6578daf64342c0270ebc09c24c50cf70e
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: "7860"
      LANGFLOW_WORKERS: "1"
      LANGFLOW_OPEN_BROWSER: "false"
      LANGFLOW_CONFIG_DIR: /app/data
      LANGFLOW_DATABASE_URL: postgresql://langflow_app:${LANGFLOW_DB_PASSWORD:?Set LANGFLOW_DB_PASSWORD in .env}@postgres:5432/langflow
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-platform_admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?Set LANGFLOW_SUPERUSER_PASSWORD in .env}
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY:?Set LANGFLOW_SECRET_KEY in .env}
      LANGFLOW_FALLBACK_TO_ENV_VAR: "false"
      DO_NOT_TRACK: "true"
    ports:
      - "127.0.0.1:${LANGFLOW_PORT:-7860}:7860"
    volumes:
      - langflow_data:/app/data
    networks:
      - database
      - outbound
    cpus: 2.0
    mem_limit: 3g
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:7860/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  backend:
    <<: *service-defaults
    build: ./backend
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-portal_admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD in .env}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?Set PLATFORM_JWT_SECRET in .env}
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE:-false}
      LANGFLOW_BASE_URL: http://langflow:7860
      PLATFORM_LANGFLOW_SERVICE_PASSWORD: ${PLATFORM_LANGFLOW_SERVICE_PASSWORD:-}
      PLATFORM_MODEL_KEY: ${PLATFORM_MODEL_KEY:-}
      LANGFLOW_EDITOR_PORT: ${LANGFLOW_PORT:-7860}
      PLATFORM_QDRANT_KEY: ${PLATFORM_QDRANT_KEY:?Set PLATFORM_QDRANT_KEY in .env}
      PLATFORM_MCP_KEY: ${PLATFORM_MCP_KEY:?Set PLATFORM_MCP_KEY in .env}
      EMBEDDING_CLOUD_URL: ${EMBEDDING_CLOUD_URL:-}
      EMBEDDING_CLOUD_MODEL: ${EMBEDDING_CLOUD_MODEL:-}
      EMBEDDING_CLOUD_DIMENSION: ${EMBEDDING_CLOUD_DIMENSION:-}
      EMBEDDING_CLOUD_KEY: ${EMBEDDING_CLOUD_KEY:-}
      OMP_NUM_THREADS: "1"
    networks:
      - database
      - portal
      - vector
      - tools
    volumes:
      - ./data/embedding:/models:ro
    cpus: 1.0
    mem_limit: 896m
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=16m]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s

  qdrant:
    <<: *service-defaults
    image: qdrant/qdrant:v1.20.2@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    environment:
      QDRANT__SERVICE__API_KEY: ${PLATFORM_QDRANT_KEY:?Set PLATFORM_QDRANT_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [vector]
    cpus: 0.5
    mem_limit: 384m
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; read -r line <&3; [[ \"$$line\" == *' 200 '* ]]"]
      interval: 10s
      timeout: 4s
      retries: 5

  ops:
    <<: *service-defaults
    image: ai-agent-platform-backend
    command: ["uvicorn", "app.ops_tools:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log", "--no-proxy-headers", "--limit-concurrency", "12"]
    init: true
    environment:
      PLATFORM_MCP_KEY: ${PLATFORM_MCP_KEY:?Set PLATFORM_MCP_KEY in .env}
    networks: [tools]
    cpus: 0.25
    mem_limit: 128m
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=4m]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5

  portal:
    <<: *service-defaults
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portal
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8080}:8080"
    cpus: 0.25
    mem_limit: 64m
    cap_drop: [ALL]
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
          mode: 01777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/portal-health"]
      interval: 10s
      timeout: 4s
      retries: 5

networks:
  database:
    internal: true
  outbound:
  portal:
  vector:
    internal: true
  tools:
    internal: true

volumes:
  postgres_data:
  langflow_data:
  qdrant_data:
