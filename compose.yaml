x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      LANGFLOW_DB_PASSWORD: ${LANGFLOW_DB_PASSWORD:?Set LANGFLOW_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/10-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    networks:
      - database
    cpus: 1.0
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  langflow:
    <<: *service-defaults
    image: langflowai/langflow:1.13.4@sha256:f5a4fbf51ad51dfcc1f93b238ef58de6578daf64342c0270ebc09c24c50cf70e
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: "7860"
      LANGFLOW_WORKERS: "1"
      LANGFLOW_OPEN_BROWSER: "false"
      LANGFLOW_CONFIG_DIR: /app/data
      LANGFLOW_DATABASE_URL: postgresql://langflow_app:${LANGFLOW_DB_PASSWORD:?Set LANGFLOW_DB_PASSWORD in .env}@postgres:5432/langflow
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-platform_admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?Set LANGFLOW_SUPERUSER_PASSWORD in .env}
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY:?Set LANGFLOW_SECRET_KEY in .env}
      LANGFLOW_FALLBACK_TO_ENV_VAR: "false"
      DO_NOT_TRACK: "true"
    ports:
      - "127.0.0.1:${LANGFLOW_PORT:-7860}:7860"
    volumes:
      - langflow_data:/app/data
    networks:
      - database
      - outbound
    cpus: 2.0
    mem_limit: 3g
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:7860/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

networks:
  database:
    internal: true
  outbound:

volumes:
  postgres_data:
  langflow_data:
